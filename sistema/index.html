<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/sistema/index.css">
    <title>Calculadora</title>
</head>
<body>
    <section class="Calculadora">
        <div class="interface">
            <p id="Resultado-Final">
                
            </p>
            
        </div>

        <div class="Elementos">
            <div class="Parte-Numerica">    
                <button class="numeros" onclick="Sistema(7)">7</button>
                <button class="numeros" onclick="Sistema(8)">8</button>
                <button class="numeros" onclick="Sistema(9)">9</button>
                <button class="numeros" onclick="Sistema(4)">4</button>
                <button class="numeros" onclick="Sistema(5)">5</button>
                <button class="numeros" onclick="Sistema(6)">6</button>
                <button class="numeros" onclick="Sistema(1)">1</button>
                <button class="numeros" onclick="Sistema(2)">2</button>
                <button class="numeros" onclick="Sistema(3)">3</button>
                <button class="numeros" onclick="Sistema(0)">0</button>
            </div>

            <div class="Operacoes">
                <button id="Operador"onclick="operacoes('x')">x</button>
                <button id="Operador" onclick="operacoes('÷')">÷</button>
                <button id="Operador" onclick="Limpar()">c</button>
                <button id="Operador" onclick="operacoes('%')">%</button>
                <button id="Operador" onclick="operacoes('+')">+</button>
                <button id="Operador" onclick="operacoes('-')">-</button>
                <button id="Operador" onclick="Calcular()">=</button>
                <button id="Operador" onclick="operacoes(',')">,</button>

            </div>
            <script src="/sistema/index.js"></script>
        </div> 
    </section>

</body>
</html>
