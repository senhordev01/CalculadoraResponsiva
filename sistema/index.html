<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/sistema/index.css">
    <title>Calculadora</title>
</head>
<body>
    <section class="Calculadora">
        <div class="interface">
            <div id="Resultado-Final">
                0
            </div>
            
        </div>

        <div class="Elementos">
            <div class="Parte-Numerica">    
                <button class="numeros">7</button>
                <button class="numeros">8</button>
                <button class="numeros" onclick="calculadora.Sistema()">9</button>
                <button class="numeros">4</button>
                <button class="numeros">5</button>
                <button class="numeros">6</button>
                <button class="numeros">1</button>
                <button class="numeros">2</button>
                <button class="numeros">3</button>
                <button class="numeros">0</button>
            </div>

            <div class="Operacoes">
                <button id="Operador">x</button>
                <button id="Operador">÷</button>
                <button id="Operador" onclick="calculadora.Limpar()">c</button>
                <button id="Operador">%</button>
                <button id="Operador">+</button>
                <button id="Operador">-</button>
                <button id="Operador">=</button>
                <button id="Operador">,</button>

            </div>
            <script src="/sistema/index.js"></script>
        </div> 
    </section>

</body>
</html>
